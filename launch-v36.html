<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050b18">
<title>LGS 2027 Arena</title>
<style>
html,body{margin:0;width:100%;height:100%;height:100dvh;background:#020710;color:#fff;font-family:Arial,Helvetica,sans-serif}body{display:grid;place-items:center;background:radial-gradient(circle at 50% 34%,#123b70,#061528 42%,#020710 78%)}.card{text-align:center;padding:26px;width:min(88vw,360px)}b{display:block;font:800 28px Georgia,serif;color:#78b9ff;letter-spacing:1.5px}span{display:block;margin-top:9px;color:#f0c96b;font-weight:900}p{font-size:13px;line-height:1.5;color:#a9bfd5;margin:15px auto}button{min-height:50px;border:0;border-radius:13px;background:#2677ff;color:#fff;padding:12px 22px;font-weight:900;font-size:15px}button[hidden]{display:none}
</style>
</head>
<body><main class="card"><b>LGS 2027 ARENA</b><span>TEMİZ BAŞLATMA V3.6</span><p id="status">Eski PWA verileri temizleniyor.</p><button id="retry" hidden>TEKRAR DENE</button></main>
<script>
(function(){
'use strict';
var status=document.getElementById('status'),retry=document.getElementById('retry');
function go(){location.replace('./index.html?bypassSW=1&v=36&direct=1&t='+Date.now())}
async function clean(){
  retry.hidden=true;
  try{
    if('serviceWorker' in navigator){var regs=await navigator.serviceWorker.getRegistrations();await Promise.allSettled(regs.map(function(r){return r.unregister()}))}
    if('caches' in window){var keys=await caches.keys();await Promise.all(keys.filter(function(k){return /lgs-2027-arena-pwa/i.test(k)}).map(function(k){return caches.delete(k)}))}
    status.textContent='Temiz sürüm hazır. Arena açılıyor.';
    setTimeout(go,250);
  }catch(e){status.textContent='Temizleme tamamlanamadı. Tekrar dene.';retry.hidden=false}
}
retry.onclick=clean;
clean();
})();
</script>
</body>
</html>
