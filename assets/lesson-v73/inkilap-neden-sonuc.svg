<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t d"><title id="t">İnkılap tarihi neden sonuç çizgisi</title><desc id="d">Olay, gerekçe, karar ve sonuç sırasını gösteren zaman çizgisi</desc><rect width="800" height="420" rx="28" fill="#22170b"/><path d="M90 220h620" stroke="#f0a23d" stroke-width="10"/><g font-family="Arial" text-anchor="middle"><g fill="#3b2812" stroke="#ffd36f" stroke-width="5"><circle cx="120" cy="220" r="60"/><circle cx="310" cy="220" r="60"/><circle cx="500" cy="220" r="60"/><circle cx="690" cy="220" r="60"/></g><g fill="#ffe4aa" font-size="22" font-weight="700"><text x="120" y="228">OLAY</text><text x="310" y="228">GEREKÇE</text><text x="500" y="228">KARAR</text><text x="690" y="228">SONUÇ</text></g><g fill="#d7b77a" font-size="18"><text x="120" y="315">ne oldu?</text><text x="310" y="315">neden?</text><text x="500" y="315">hangi amaçla?</text><text x="690" y="315">ne değişti?</text></g></g></svg>
