<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc">
  <title id="title">İki kaldıraçta kuvvet kolu karşılaştırması</title>
  <desc id="desc">Aynı yük ve aynı yük kolu kullanılan iki kaldıraçtan ikincisinde kuvvet kolu iki kat uzundur.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#071a2c"/><stop offset="1" stop-color="#0d2d48"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#ffca65"/></marker>
    <marker id="measure" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M8 0 0 4 8 8Z" fill="#70b9ff"/></marker>
  </defs>
  <rect width="960" height="460" rx="30" fill="url(#bg)"/>
  <text x="480" y="42" fill="#f6df9b" font-family="Arial" font-size="24" font-weight="700" text-anchor="middle">AYNI YÜK · AYNI YÜK KOLU · SÜRTÜNME YOK</text>
  <line x1="480" y1="70" x2="480" y2="410" stroke="#ffffff20" stroke-width="3"/>

  <g font-family="Arial">
    <text x="240" y="88" fill="#8fd6ff" font-size="23" font-weight="700" text-anchor="middle">DÜZENEK I</text>
    <line x1="74" y1="250" x2="420" y2="250" stroke="#d9e8f5" stroke-width="16" stroke-linecap="round"/>
    <path d="M310 250 270 326h80Z" fill="#e9a94a" stroke="#ffd98a" stroke-width="4"/>
    <line x1="270" y1="336" x2="350" y2="336" stroke="#cfdef0" stroke-width="7" stroke-linecap="round"/>
    <rect x="354" y="174" width="72" height="72" rx="9" fill="#8b5c3e" stroke="#ffd49a" stroke-width="4"/>
    <text x="390" y="217" fill="#fff3dc" font-size="19" font-weight="700" text-anchor="middle">YÜK</text>
    <line x1="92" y1="122" x2="92" y2="219" stroke="#ffca65" stroke-width="8" marker-end="url(#arrow)"/>
    <text x="112" y="147" fill="#ffdc8b" font-size="22" font-weight="700">F</text>
    <line x1="92" y1="294" x2="310" y2="294" stroke="#70b9ff" stroke-width="4" marker-start="url(#measure)" marker-end="url(#measure)"/>
    <text x="201" y="323" fill="#9dd5ff" font-size="20" font-weight="700" text-anchor="middle">Kuvvet kolu = L</text>
    <line x1="310" y1="366" x2="390" y2="366" stroke="#70b9ff" stroke-width="4" marker-start="url(#measure)" marker-end="url(#measure)"/>
    <text x="350" y="398" fill="#9dd5ff" font-size="18" text-anchor="middle">Yük kolu = d</text>
  </g>

  <g font-family="Arial">
    <text x="720" y="88" fill="#8fd6ff" font-size="23" font-weight="700" text-anchor="middle">DÜZENEK II</text>
    <line x1="520" y1="250" x2="910" y2="250" stroke="#d9e8f5" stroke-width="16" stroke-linecap="round"/>
    <path d="M800 250 760 326h80Z" fill="#e9a94a" stroke="#ffd98a" stroke-width="4"/>
    <line x1="760" y1="336" x2="840" y2="336" stroke="#cfdef0" stroke-width="7" stroke-linecap="round"/>
    <rect x="844" y="174" width="72" height="72" rx="9" fill="#8b5c3e" stroke="#ffd49a" stroke-width="4"/>
    <text x="880" y="217" fill="#fff3dc" font-size="19" font-weight="700" text-anchor="middle">YÜK</text>
    <line x1="538" y1="122" x2="538" y2="219" stroke="#ffca65" stroke-width="8" marker-end="url(#arrow)"/>
    <circle cx="570" cy="143" r="22" fill="#132f49" stroke="#ffca65" stroke-width="3"/>
    <text x="570" y="151" fill="#ffdc8b" font-size="24" font-weight="700" text-anchor="middle">?</text>
    <line x1="538" y1="294" x2="800" y2="294" stroke="#70b9ff" stroke-width="4" marker-start="url(#measure)" marker-end="url(#measure)"/>
    <text x="669" y="323" fill="#9dd5ff" font-size="20" font-weight="700" text-anchor="middle">Kuvvet kolu = 2L</text>
    <line x1="800" y1="366" x2="880" y2="366" stroke="#70b9ff" stroke-width="4" marker-start="url(#measure)" marker-end="url(#measure)"/>
    <text x="840" y="398" fill="#9dd5ff" font-size="18" text-anchor="middle">Yük kolu = d</text>
  </g>
</svg>
