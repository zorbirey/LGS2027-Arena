<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#030914">
<title>LGS 2027 Arena V3.2</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030914}iframe{display:block;width:100%;height:100dvh;border:0;background:#030914}
</style>
</head>
<body>
<iframe id="arenaFrame" src="./demo-v30.html?bypassSW=1&v=32" title="LGS 2027 Arena V3.2"></iframe>
<script>
(function(){
  const frame=document.getElementById('arenaFrame');
  function tune(){
    try{
      const d=frame.contentDocument;
      if(!d||!d.head)return;
      let st=d.getElementById('v32FitStyle');
      if(!st){st=d.createElement('style');st.id='v32FitStyle';d.head.appendChild(st)}
      st.textContent=`
        .watermark{opacity:.24!important;width:min(96vw,470px)!important;top:52%!important;filter:brightness(1.18) contrast(1.06)!important}
        .card,.subject,.solve-grid button{background:linear-gradient(145deg,rgba(13,41,72,.84),rgba(6,21,41,.84))!important}
        [data-page="subjects"].page{overflow:hidden!important;padding:8px 12px 7px!important}
        [data-page="subjects"] .section-title{margin:2px 2px 7px!important}
        [data-page="subjects"] .section-title h2{font-size:18px!important;line-height:1.05!important}
        [data-page="subjects"] .section-title b{font-size:24px!important}
        [data-page="subjects"] .subject-grid{height:calc(100% - 52px)!important;grid-template-rows:repeat(6,minmax(0,1fr))!important;gap:4px!important}
        [data-page="subjects"] .subject{min-height:0!important;padding:5px 8px!important;border-radius:15px!important;grid-template-columns:38px 1fr auto!important;gap:7px!important}
        [data-page="subjects"] .subject-icon{width:36px!important;height:36px!important;border-radius:11px!important;font-size:17px!important}
        [data-page="subjects"] .subject h3{font-size:15px!important;line-height:1.05!important}
        [data-page="subjects"] .subject p{font-size:9px!important;margin-top:2px!important}
        [data-page="subjects"] .subject button{padding:7px 8px!important;font-size:9px!important;border-radius:9px!important}
        [data-page="solve"].page{overflow:hidden!important;padding:8px 12px 7px!important}
        #solveLauncher{height:100%!important;display:grid!important;grid-template-rows:auto minmax(0,1fr)!important;min-height:0!important}
        #solveLauncher .section-title{margin:2px 2px 7px!important}
        #solveLauncher .section-title h2{font-size:18px!important;line-height:1.05!important}
        #solveLauncher .section-title b{font-size:24px!important}
        #solveGrid{height:100%!important;min-height:0!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;grid-template-rows:repeat(3,minmax(0,1fr))!important;gap:5px!important}
        #solveGrid button{min-height:0!important;height:auto!important;padding:6px 5px!important;border-radius:15px!important}
        #solveGrid b{font-size:20px!important;line-height:1!important}
        #solveGrid span{font-size:15px!important;line-height:1.05!important;margin-top:4px!important}
        #solveGrid small{font-size:9px!important;margin-top:3px!important}
        #quiz.active{height:100%!important;overflow:auto!important;padding-bottom:4px!important}
        @media(max-height:720px){
          [data-page="subjects"] .subject-grid{height:calc(100% - 48px)!important}
          [data-page="subjects"] .subject{padding:4px 7px!important}
          [data-page="subjects"] .subject h3{font-size:14px!important}
          [data-page="subjects"] .subject p{font-size:8px!important}
          #solveGrid button{padding:4px!important}
          #solveGrid span{font-size:14px!important}
        }
      `;
      const small=d.querySelector('.brand small');if(small)small.textContent='V3.2 FIT';
      const coverTag=d.querySelector('.cover-brand em');if(coverTag)coverTag.textContent='INSPIRED FROM ZEUS · V3.2 FIT';
    }catch(e){}
  }
  frame.addEventListener('load',tune);
  setTimeout(tune,1200);
})();
</script>
</body>
</html>
