<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#030914">
<title>LGS 2027 Arena V3.3</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030914}iframe{display:block;width:100%;height:100dvh;border:0;background:#030914}</style>
</head>
<body>
<iframe id="arenaFrame" src="./demo-v30.html?bypassSW=1&v=33" title="LGS 2027 Arena V3.3"></iframe>
<script>
(function(){
 const frame=document.getElementById('arenaFrame');
 const ZEUS='./assets/zeus-v33.jpg?v=33';
 function tune(){
  try{
   const d=frame.contentDocument;if(!d||!d.head)return;
   d.querySelectorAll('img').forEach(img=>{const s=img.getAttribute('src')||'';if(s.includes('zeus'))img.src=ZEUS});
   let st=d.getElementById('v33Style');if(!st){st=d.createElement('style');st.id='v33Style';d.head.appendChild(st)}
   st.textContent=`
    .page{padding-left:5px!important;padding-right:5px!important}
    .watermark{opacity:.27!important;width:min(112vw,560px)!important;top:55%!important;filter:brightness(1.12) contrast(1.05)!important}
    .card,.subject,.solve-grid button{background:linear-gradient(145deg,rgba(13,41,72,.78),rgba(6,21,41,.78))!important}
    [data-page="subjects"].page{overflow:hidden!important;padding:6px 5px 5px!important}
    [data-page="subjects"] .section-title{margin:2px 4px 6px!important}
    [data-page="subjects"] .subject-grid{height:calc(100% - 50px)!important;grid-template-rows:repeat(6,minmax(0,1fr))!important;gap:4px!important}
    [data-page="subjects"] .subject{min-height:0!important;padding:5px 7px!important;border-radius:15px!important;grid-template-columns:38px 1fr auto!important;gap:7px!important}
    [data-page="subjects"] .subject-icon{width:36px!important;height:36px!important;font-size:17px!important}
    [data-page="subjects"] .subject h3{font-size:15px!important;line-height:1.04!important}
    [data-page="subjects"] .subject p{font-size:9px!important;margin-top:2px!important}
    [data-page="solve"].page{overflow:hidden!important;padding:6px 5px 5px!important}
    #solveLauncher{height:100%!important;display:grid!important;grid-template-rows:auto minmax(0,1fr)!important}
    #solveLauncher .section-title{margin:2px 4px 6px!important}
    #solveGrid{height:100%!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;grid-template-rows:repeat(3,minmax(0,1fr))!important;gap:5px!important}
    #solveGrid button{min-height:0!important;padding:5px!important;border-radius:15px!important}
    [data-page="zeus"].page{padding:8px 5px 6px!important;overflow:hidden!important}
    [data-page="zeus"] .zeus-card{width:100%!important;margin:0!important;border-radius:18px!important}
    [data-page="zeus"] .zeus-card img{display:block!important;width:100%!important;height:245px!important;object-fit:cover!important;object-position:center 12%!important}
    [data-page="zeus"] .section-title{margin:10px 4px 6px!important}
    [data-page="zeus"] .solve-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:6px!important}
    [data-page="zeus"] .solve-grid button{min-height:118px!important}
    [data-page="progress"].page{padding:8px 5px 6px!important;overflow:hidden!important}
    [data-page="progress"] .section-title{margin:4px 4px 8px!important}
    [data-page="progress"] .progress-list{gap:5px!important}
    [data-page="progress"] .progress-row{width:100%!important;padding:9px 12px!important;border-radius:15px!important}
    [data-page="progress"] .mission{width:100%!important;margin-top:7px!important;padding:10px 12px!important}
    [data-page="arena"].page,[data-page="mock"].page{padding-left:5px!important;padding-right:5px!important}
    @media(max-height:720px){
      [data-page="zeus"] .zeus-card img{height:205px!important}
      [data-page="zeus"] .solve-grid button{min-height:96px!important}
      [data-page="progress"] .progress-row{padding:7px 10px!important}
      [data-page="subjects"] .subject{padding:4px 6px!important}
    }
   `;
   const small=d.querySelector('.brand small');if(small)small.textContent='V3.3 FULL';
   const tag=d.querySelector('.cover-brand em');if(tag)tag.textContent='INSPIRED FROM ZEUS · V3.3 FULL';
  }catch(e){}
 }
 frame.addEventListener('load',()=>{tune();setTimeout(tune,250);setTimeout(tune,1200)});
 setTimeout(tune,1400);
})();
</script>
</body>
</html>
