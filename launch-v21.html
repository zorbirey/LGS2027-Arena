<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050b18">
<title>LGS 2027 Arena</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#020710;color:#fff;font-family:Arial,Helvetica,sans-serif}#boot{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 32%,#143f73 0,#061528 38%,#020710 76%)}#boot>div{text-align:center;padding:28px;max-width:340px}#boot b{display:block;font:800 27px Georgia,serif;color:#78b9ff;letter-spacing:2px}#boot span{display:block;margin-top:8px;color:#f5d88e;font-weight:800;letter-spacing:1px}#boot p{font-size:12px;line-height:1.5;color:#adc1d5}#open{margin:16px auto 0;padding:13px 20px;border:0;border-radius:12px;background:#2677ff;color:#fff;font-weight:900}
</style>
</head>
<body>
<div id="boot"><div><b>LGS 2027 ARENA</b><span>V2.7 TEMİZ MİMARİ</span><p>Eski giriş/PWA katmanları kaldırılıyor. Öğrenci ilerlemesi ve yerel çalışma verileri korunur.</p><button id="open">ARENAYI AÇ</button></div></div>
<script>
(function(){
'use strict';
var done=false,button=document.getElementById('open');
function go(){if(done)return;done=true;location.replace('./index.html?v=27&clean='+Date.now())}
button.onclick=go;
(async function(){
  try{
    if('serviceWorker' in navigator){
      var regs=await navigator.serviceWorker.getRegistrations();
      await Promise.allSettled(regs.map(function(r){return r.unregister()}));
      var reg=await navigator.serviceWorker.register('./service-worker.js?v=27',{scope:'./'});
      try{await reg.update()}catch(e){}
      if(reg.waiting)reg.waiting.postMessage('SKIP_WAITING');
      await Promise.race([navigator.serviceWorker.ready,new Promise(function(resolve){setTimeout(resolve,2800)})]);
    }
  }catch(e){}
  go();
})();
setTimeout(go,4500);
})();
</script>
</body>
</html>
