<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050b18">
  <title>LGS 2027 Arena</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#020710;color:#fff;font-family:Arial,Helvetica,sans-serif}
    #boot{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 32%,#143f73 0,#061528 38%,#020710 76%);z-index:99999}
    #boot>div{text-align:center;padding:28px;max-width:330px}
    #boot b{display:block;font:800 26px Georgia,serif;color:#78b9ff;letter-spacing:2px}
    #boot span{display:block;margin-top:8px;color:#f5d88e;font-weight:800;letter-spacing:1px}
    #boot p{font-size:12px;line-height:1.45;color:#adc1d5}
  </style>
</head>
<body>
<div id="boot"><div><b>LGS 2027 ARENA</b><span>V2.1 TEMİZ BAŞLATMA</span><p>Uygulama çekirdeği ve butonlar hazırlanıyor...</p></div></div>
<script>
(async()=>{
  const VERSION='21';
  const CLEAN_FLAG='lgsArenaCleanBootV21';
  try{
    if(navigator.onLine && localStorage.getItem(CLEAN_FLAG)!=='1' && 'caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.filter(k=>/lgs-2027-arena-pwa/i.test(k)).map(k=>caches.delete(k)));
      localStorage.setItem(CLEAN_FLAG,'1');
    }
  }catch(e){}
  try{
    let res=null;
    if(navigator.onLine){
      res=await fetch('./index.html?boot='+VERSION+'&t='+Date.now(),{cache:'no-store'});
    }else if('caches' in window){
      res=await caches.match('./index.html');
    }
    if(!res || !res.ok) throw new Error('index unavailable');
    let html=await res.text();
    html=html.replaceAll('?v=181','?v='+VERSION).replaceAll('?v=182','?v='+VERSION).replaceAll('?v=20','?v='+VERSION);
    html=html.replace('manifest.webmanifest?v=181','manifest.webmanifest?v='+VERSION);
    const critical=`<script>
(function(){
  var KEY='lgsArenaStudentProfileV20';
  var b=document.getElementById('skipCover');
  if(!b)return;
  b.addEventListener('click',function(e){
    if(!e.isTrusted){e.preventDefault();e.stopImmediatePropagation();return;}
    e.preventDefault();e.stopImmediatePropagation();
    if(window.LgsArenaStudentProfile&&window.LgsArenaStudentProfile.open){window.LgsArenaStudentProfile.open();return;}
    var p={};try{p=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(x){}
    var name=(p.name||'').trim();
    if(!name){name=(window.prompt('Öğrenci adını gir')||'').trim();if(name.length<2)return;try{localStorage.setItem(KEY,JSON.stringify({name:name,createdAt:new Date().toISOString(),storage:'device-demo'}))}catch(x){}}
    var cover=document.getElementById('cover'),shell=document.getElementById('shell');
    if(cover){cover.classList.remove('active');cover.classList.add('hidden')}
    if(shell)shell.classList.remove('hidden');
  },true);
})();
<\/script>`;
    html=html.replace('<script src="app.js?v='+VERSION+'"></script>',critical+'<script src="app.js?v='+VERSION+'"></script>');
    html=html.replace('</body>',`<script>if('serviceWorker' in navigator&&location.protocol!=='file:'){navigator.serviceWorker.register('./service-worker.js?v=21').then(function(r){r.update().catch(function(){})}).catch(function(){})}<\/script></body>`);
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    document.getElementById('boot').innerHTML='<div><b>LGS 2027 ARENA</b><span>BAĞLANTI HATASI</span><p>Uygulama dosyaları alınamadı. İlk temiz açılış için internet bağlantısı gerekli.</p><button onclick="location.reload()" style="padding:12px 18px;border:0;border-radius:12px;background:#2677ff;color:#fff;font-weight:800">TEKRAR DENE</button></div>';
  }
})();
</script>
</body>
</html>
