<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050b18">
  <title>LGS 2027 Arena</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#020710;color:#fff;font-family:Arial,Helvetica,sans-serif}
    #boot{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 32%,#143f73 0,#061528 38%,#020710 76%)}
    #boot>div{text-align:center;padding:28px;max-width:330px}
    #boot b{display:block;font:800 27px Georgia,serif;color:#78b9ff;letter-spacing:2px}
    #boot span{display:block;margin-top:8px;color:#f5d88e;font-weight:800;letter-spacing:1px}
    #boot p{font-size:12px;line-height:1.45;color:#adc1d5}
    #retry{display:none;margin:16px auto 0;padding:12px 18px;border:0;border-radius:12px;background:#2677ff;color:#fff;font-weight:800}
  </style>
</head>
<body>
<div id="boot"><div><b>LGS 2027 ARENA</b><span>V2.2 DOĞRUDAN BAŞLATMA</span><p>Eski PWA önbelleği temizleniyor. Arena birkaç saniye içinde açılacak.</p><button id="retry">ARENA'YI AÇ</button></div></div>
<script>
(function(){
  'use strict';
  var finished=false;
  var retry=document.getElementById('retry');
  function target(){return './index.html?v=22&fresh='+Date.now()}
  function go(){if(finished)return;finished=true;location.replace(target())}
  retry.onclick=go;
  setTimeout(function(){retry.style.display='block'},1800);
  setTimeout(go,3200);
  (async function(){
    try{
      if('serviceWorker' in navigator){
        var regs=await navigator.serviceWorker.getRegistrations();
        await Promise.allSettled(regs.map(function(r){return r.unregister()}));
      }
    }catch(e){}
    try{
      if('caches' in window){
        var keys=await caches.keys();
        await Promise.allSettled(keys.filter(function(k){return /lgs-2027-arena-pwa/i.test(k)}).map(function(k){return caches.delete(k)}));
      }
    }catch(e){}
    try{
      var stamp=Date.now();
      var urls=['./index.html','./app.js?v=181','./pwa.js?v=181','./profile-gate-v20.js?v=20','./english-integration-v18.js?v=181'];
      await Promise.race([
        Promise.allSettled(urls.map(function(u){return fetch(u+(u.indexOf('?')>-1?'&':'?')+'fresh='+stamp,{cache:'reload'})})),
        new Promise(function(resolve){setTimeout(resolve,1600)})
      ]);
    }catch(e){}
    go();
  })();
})();
</script>
</body>
</html>
